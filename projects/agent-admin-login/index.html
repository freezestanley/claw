<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Agent 后管系统登录" />
    <title>Agent 后管系统 · 登录</title>

    <!-- Tailwind (browser CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eff6ff",
                100: "#dbeafe",
                300: "#93c5fd",
                400: "#60a5fa",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8"
              },
              ink: {
                950: "#0b0f1a",
                900: "#0f1626",
                800: "#161f33",
                700: "#1e293b"
              }
            },
            fontFamily: {
              sans: [
                "Inter",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                "sans-serif"
              ]
            }
          }
        }
      };
    </script>

    <!-- Lucide icons (admin tooling context) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- anime.js for light entrance motion -->
    <script src="https://cdn.jsdelivr.net.cn/npm/animejs/dist/bundles/anime.umd.min.js"></script>

    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* 细网格氛围（蓝调，非紫） */
      .bg-grid {
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      .glow {
        background:
          radial-gradient(60% 50% at 20% 18%, rgba(59, 130, 246, 0.22), transparent 70%),
          radial-gradient(40% 40% at 85% 90%, rgba(56, 189, 248, 0.12), transparent 70%);
      }
      /* 输入自动填充配色，避免白底白字 */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #f1f5f9;
        -webkit-box-shadow: 0 0 0 1000px #11192b inset;
        caret-color: #f1f5f9;
        transition: background-color 9999s ease-out 0s;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body class="bg-ink-950 text-slate-100 font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
